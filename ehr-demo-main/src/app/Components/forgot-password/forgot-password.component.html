<div class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="w-full max-w-md p-6 bg-white rounded-lg shadow-md">
    <h2 class="text-2xl font-semibold text-center text-gray-800">Forgot Password</h2>
    <p class="text-center text-gray-600 mb-4">Enter your email to receive a reset link</p>

    <form [formGroup]="forgotPasswordForm" (ngSubmit)="submit()" class="space-y-4">
      <!-- Email Field -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Email:</label>
        <input 
          type="email" 
          formControlName="email" 
          required 
          class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500"
          placeholder="Enter your email"
        />
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        [disabled]="forgotPasswordForm.invalid"
        class="w-full px-4 py-2 text-white bg-blue-600 rounded-md hover:bg-blue-700 disabled:opacity-50"
      >
        Send Reset Link
      </button>
    </form>

    <!-- Success/Error Messages -->
    <p *ngIf="message" class="mt-2 text-sm text-green-600">{{ message }}</p>
    <p *ngIf="error" class="mt-2 text-sm text-red-600">{{ error }}</p>

    <!-- Back to Login -->
    <div class="mt-4 text-center">
      <a (click)="goToLogin()" class="text-sm text-blue-600 hover:underline cursor-pointer">
        Back to Login
      </a>
          </div>
  </div>
</div>
