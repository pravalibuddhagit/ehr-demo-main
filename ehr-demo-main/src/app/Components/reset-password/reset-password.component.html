<h2>Reset Password</h2>
<form [formGroup]="resetPasswordForm" (ngSubmit)="submit()">
  <label>New Password:</label>
  <input type="password" formControlName="newPassword" required />
  <button type="submit" [disabled]="resetPasswordForm.invalid">Reset Password</button>
</form>
<p *ngIf="message" style="color: green;">{{ message }}</p>
<p *ngIf="error" style="color: red;">{{ error }}</p>
